<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="ui-monospace, 'IBM Plex Mono', monospace">
  <defs>
    <marker id="mArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff4dff"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#000000"/>

  <!-- process -->
  <rect x="20" y="54" width="860" height="344" rx="8" fill="none" stroke="#5c5c5c" stroke-width="2"/>
  <text x="34" y="44" fill="#9a9a9a" font-size="13">Espace d'adressage du process (64 bits)</text>

  <!-- sandbox -->
  <rect x="42" y="78" width="512" height="300" rx="8" fill="#140d04" stroke="#ff8c1a" stroke-width="2.5"/>
  <text x="58" y="104" fill="#ff8c1a" font-size="15" font-weight="bold">V8 Sandbox</text>
  <text x="200" y="104" fill="#ff8c1a" font-size="13">1 To</text>
  <text x="58" y="124" fill="#9a9a9a" font-size="12">0x1f8600000000 .. 0x208600000000</text>

  <!-- cage -->
  <rect x="62" y="146" width="212" height="214" rx="6" fill="#071318" stroke="#3fd0ff" stroke-width="2.5"/>
  <text x="76" y="172" fill="#3fd0ff" font-size="14" font-weight="bold">Cage</text>
  <text x="180" y="172" fill="#3fd0ff" font-size="12">4 Go</text>
  <text x="76" y="196" fill="#ffffff" font-size="12">objets du tas</text>
  <text x="76" y="214" fill="#ffffff" font-size="12">Map, elements, …</text>
  <text x="76" y="238" fill="#9a9a9a" font-size="11.5">pointeurs 32 bits</text>
  <text x="76" y="300" fill="#9a9a9a" font-size="11">0x1f8600000000</text>
  <text x="76" y="318" fill="#9a9a9a" font-size="11">0x1f8700000000</text>
  <rect x="72" y="330" width="192" height="22" rx="4" fill="#111113" stroke="#ff2a2a" stroke-width="1.5"/>
  <text x="168" y="345" fill="#ff2a2a" font-size="11" text-anchor="middle">corruption ici → &lt; 4 Go</text>

  <!-- backing store -->
  <rect x="294" y="168" width="244" height="86" rx="6" fill="#19081a" stroke="#ff4dff" stroke-width="2"/>
  <text x="308" y="192" fill="#ff4dff" font-size="13" font-weight="bold">backing store</text>
  <text x="308" y="212" fill="#ffffff" font-size="12">ArrayBuffer : 0x1f8800004000</text>
  <text x="308" y="232" fill="#9a9a9a" font-size="11.5">donnée, dans le sandbox</text>
  <text x="308" y="248" fill="#9a9a9a" font-size="11.5">hors cage → pointeur sandboxé</text>

  <text x="294" y="292" fill="#9a9a9a" font-size="12">Un pointeur sandboxé = offset &lt;&lt; 24.</text>
  <text x="294" y="312" fill="#9a9a9a" font-size="12">Quoi qu'on écrive, l'adresse</text>
  <text x="294" y="330" fill="#9a9a9a" font-size="12">décodée reste dans le 1 To.</text>

  <!-- outside : tables + targets -->
  <rect x="580" y="92" width="290" height="50" rx="6" fill="#19081a" stroke="#ff4dff" stroke-width="2"/>
  <text x="596" y="112" fill="#ff4dff" font-size="13" font-weight="bold">External Pointer Table</text>
  <text x="596" y="130" fill="#9a9a9a" font-size="11.5">EPT — pointeurs C++ / externes</text>

  <rect x="580" y="150" width="290" height="50" rx="6" fill="#19081a" stroke="#ff4dff" stroke-width="2"/>
  <text x="596" y="170" fill="#ff4dff" font-size="13" font-weight="bold">Trusted Pointer Table</text>
  <text x="596" y="188" fill="#9a9a9a" font-size="11.5">TPT — Code, RegExpData…</text>

  <rect x="580" y="214" width="290" height="104" rx="6" fill="#111113" stroke="#9a9a9a" stroke-width="2"/>
  <text x="596" y="238" fill="#ffffff" font-size="13" font-weight="bold">Hors sandbox</text>
  <text x="596" y="260" fill="#9a9a9a" font-size="12">objets C++, code machine,</text>
  <text x="596" y="278" fill="#9a9a9a" font-size="12">RegExpData, données externes</text>
  <text x="596" y="300" fill="#ff4dff" font-size="12">0x3afb01000421  →</text>

  <line x1="580" y1="117" x2="538" y2="211" stroke="#ff4dff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M725 200 L725 214" stroke="#ff4dff" stroke-width="2" marker-end="url(#mArrow)"/>

  <text x="20" y="422" fill="#9a9a9a" font-size="12.5">cage ⊂ sandbox ⊂ process. Les tables vivent hors sandbox : un read/write sandboxé ne les atteint pas.</text>
</svg>
