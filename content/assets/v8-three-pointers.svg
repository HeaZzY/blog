<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="ui-monospace, 'IBM Plex Mono', monospace">
  <defs>
    <marker id="pC" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#3fd0ff"/></marker>
    <marker id="pS" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff8c1a"/></marker>
    <marker id="pE" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff4dff"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" fill="#000000"/>

  <!-- column headers -->
  <text x="30" y="34" fill="#9a9a9a" font-size="12">champ dans l'objet</text>
  <text x="470" y="34" fill="#9a9a9a" font-size="12">décodage</text>
  <text x="640" y="34" fill="#9a9a9a" font-size="12">cible</text>

  <!-- row 1 : compressed -->
  <rect x="30" y="52" width="150" height="56" rx="6" fill="#071318" stroke="#3fd0ff" stroke-width="2"/>
  <text x="105" y="76" fill="#3fd0ff" font-size="13" font-weight="bold" text-anchor="middle">Compressé</text>
  <text x="105" y="96" fill="#9a9a9a" font-size="11" text-anchor="middle">32 bits</text>
  <rect x="200" y="64" width="150" height="32" rx="5" fill="#111113" stroke="#3fd0ff" stroke-width="1.5"/>
  <text x="275" y="85" fill="#ffffff" font-size="14" text-anchor="middle">0101026d</text>
  <path d="M360 80 L470 80" stroke="#3fd0ff" stroke-width="2.5" marker-end="url(#pC)"/>
  <text x="415" y="72" fill="#3fd0ff" font-size="11" text-anchor="middle">+ base</text>
  <rect x="478" y="60" width="392" height="40" rx="6" fill="#071318" stroke="#3fd0ff" stroke-width="1.5"/>
  <text x="492" y="85" fill="#ffffff" font-size="12.5">objet du tas</text>
  <text x="860" y="85" fill="#3fd0ff" font-size="11.5" text-anchor="end">cage — 4 Go</text>

  <!-- row 2 : sandboxed -->
  <rect x="30" y="148" width="150" height="56" rx="6" fill="#140d04" stroke="#ff8c1a" stroke-width="2"/>
  <text x="105" y="172" fill="#ff8c1a" font-size="13" font-weight="bold" text-anchor="middle">Sandboxé</text>
  <text x="105" y="192" fill="#9a9a9a" font-size="11" text-anchor="middle">offset &lt;&lt; 24</text>
  <rect x="190" y="160" width="250" height="32" rx="5" fill="#111113" stroke="#ff8c1a" stroke-width="1.5"/>
  <text x="315" y="181" fill="#ffffff" font-size="13" text-anchor="middle">0x0200004000000000</text>
  <path d="M450 176 L470 176" stroke="#ff8c1a" stroke-width="2.5" marker-end="url(#pS)"/>
  <text x="340" y="150" fill="#ff8c1a" font-size="11" text-anchor="middle">&gt;&gt;24 + base</text>
  <rect x="478" y="156" width="392" height="40" rx="6" fill="#140d04" stroke="#ff8c1a" stroke-width="1.5"/>
  <text x="492" y="181" fill="#ffffff" font-size="12.5">0x1f8800004000  (backing store)</text>
  <text x="860" y="181" fill="#ff8c1a" font-size="11.5" text-anchor="end">sandbox — 1 To</text>

  <!-- row 3 : external -->
  <rect x="30" y="244" width="150" height="56" rx="6" fill="#19081a" stroke="#ff4dff" stroke-width="2"/>
  <text x="105" y="268" fill="#ff4dff" font-size="13" font-weight="bold" text-anchor="middle">Externe</text>
  <text x="105" y="288" fill="#9a9a9a" font-size="11" text-anchor="middle">handle</text>
  <rect x="200" y="256" width="150" height="32" rx="5" fill="#111113" stroke="#ff4dff" stroke-width="1.5"/>
  <text x="275" y="277" fill="#ffffff" font-size="14" text-anchor="middle">0x00400c00</text>
  <path d="M360 272 L470 272" stroke="#ff4dff" stroke-width="2.5" marker-end="url(#pE)"/>
  <text x="415" y="264" fill="#ff4dff" font-size="11" text-anchor="middle">table</text>
  <rect x="478" y="252" width="392" height="40" rx="6" fill="#19081a" stroke="#ff4dff" stroke-width="1.5"/>
  <text x="492" y="277" fill="#ffffff" font-size="12.5">0x3afb01000421</text>
  <text x="860" y="277" fill="#ff4dff" font-size="11.5" text-anchor="end">hors sandbox</text>

  <text x="30" y="336" fill="#9a9a9a" font-size="12">Plus le pointeur porte loin, plus il est indirect : compression &lt; pointeur sandboxé &lt; handle de table.</text>
</svg>
