<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="ui-monospace, 'IBM Plex Mono', monospace">
  <defs>
    <marker id="aS" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#c9c9c9"/></marker>
    <marker id="aD" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#9a9a9a"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="600" fill="#000000"/>

  <!-- sandbox -->
  <rect x="16" y="16" width="688" height="316" rx="4" fill="#140f10" stroke="#b36a6a" stroke-width="2.5"/>
  <text x="360" y="48" fill="#d98a8a" font-size="19" font-weight="bold" text-anchor="middle">V8 Sandbox</text>
  <text x="360" y="68" fill="#8a8a8a" font-size="12" text-anchor="middle">1 To de mémoire virtuelle</text>

  <!-- cage -->
  <rect x="40" y="82" width="640" height="234" rx="4" fill="#0e1418" stroke="#5f93aa" stroke-width="1.8"/>
  <text x="56" y="106" fill="#7fb0c4" font-size="13" font-weight="bold">Cage</text>
  <text x="104" y="106" fill="#8a8a8a" font-size="11.5">4 Go, les objets du tas</text>

  <!-- object A -->
  <rect x="78" y="168" width="172" height="66" rx="6" fill="#171208" stroke="#c88a3e" stroke-width="2"/>
  <text x="164" y="206" fill="#ffffff" font-size="15" text-anchor="middle">Objet V8</text>

  <!-- object B -->
  <rect x="452" y="104" width="172" height="66" rx="6" fill="#171208" stroke="#c88a3e" stroke-width="2"/>
  <text x="538" y="142" fill="#ffffff" font-size="15" text-anchor="middle">Objet V8</text>

  <!-- offset arrow A -> B -->
  <path d="M250 196 C382 206 476 200 528 174" fill="none" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#aS)"/>
  <text x="372" y="228" fill="#c9c9c9" font-size="14">Offset</text>

  <!-- index dashed A -> table -->
  <path d="M164 234 C116 300 108 398 150 444" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aD)"/>
  <text x="176" y="366" fill="#9a9a9a" font-size="14">Index</text>

  <!-- pointer table (outside sandbox) -->
  <rect x="150" y="380" width="252" height="184" rx="4" fill="#0e151a" stroke="#5f93aa" stroke-width="1.8"/>
  <line x1="150" y1="422" x2="402" y2="422" stroke="#3a4a52" stroke-width="1.2"/>
  <line x1="150" y1="468" x2="402" y2="468" stroke="#3a4a52" stroke-width="1.2"/>
  <line x1="150" y1="514" x2="402" y2="514" stroke="#3a4a52" stroke-width="1.2"/>
  <text x="276" y="408" fill="#7fb0c4" font-size="15" text-anchor="middle">Table de pointeurs</text>
  <text x="276" y="451" fill="#ffffff" font-size="14" text-anchor="middle">Entrée 0</text>
  <text x="276" y="497" fill="#bdbdbd" font-size="14" text-anchor="middle">Entrée 1</text>
  <text x="276" y="543" fill="#8a8a8a" font-size="14" text-anchor="middle">...</text>

  <!-- external object -->
  <rect x="462" y="446" width="196" height="66" rx="6" fill="#0e1710" stroke="#6fae72" stroke-width="2"/>
  <text x="560" y="484" fill="#ffffff" font-size="15" text-anchor="middle">Objet externe</text>

  <!-- entry0 -> external -->
  <path d="M402 445 C432 450 444 470 460 478" fill="none" stroke="#c9c9c9" stroke-width="2.5" marker-end="url(#aS)"/>

  <text x="16" y="588" fill="#8a8a8a" font-size="12">D'après v8.dev/blog/sandbox. Corrompre un offset ou un index ne forge jamais un vrai pointeur.</text>
</svg>
